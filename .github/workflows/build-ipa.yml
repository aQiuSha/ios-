name: Build & Export IPA（真机）

on:
  workflow_dispatch:  # 仅手动触发，需要配置签名密钥

jobs:
  build-ipa:
    name: 打包真机 IPA
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 项目
        run: xcodegen generate

      - name: 导入签名证书
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # 从 secret 解码证书
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > build_certificate.p12

          # 创建临时钥匙串
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # 导入证书
          security import build_certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # 设置钥匙串超时
          security set-keychain-settings -lut 21600 build.keychain

      - name: 安装 Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ComicReader.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp ComicReader.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: 编译真机版本
        run: |
          xcodebuild build \
            -project ComicReader.xcodeproj \
            -scheme ComicReader \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/ComicReader.xcarchive \
            archive | xcpretty

      - name: 导出 IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ComicReader.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist <(cat <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF
          ) | xcpretty

      - name: 上传 IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ComicReader-IPA
          path: build/export/*.ipa
          retention-days: 90
