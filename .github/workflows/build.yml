name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 编译 iOS 应用
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 安装 xcpretty
        run: gem install xcpretty

      - name: 生成 Xcode 项目
        run: xcodegen generate

      - name: 列出 Xcode 版本
        run: xcodebuild -version

      - name: 解析 Swift Package 依赖
        run: xcodebuild -resolvePackageDependencies -project ComicReader.xcodeproj

      - name: 编译（模拟器，无需签名）
        run: |
          xcodebuild build \
            -project ComicReader.xcodeproj \
            -scheme ComicReader \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty
        env:
          NSUnbufferedIO: YES

      - name: 上传编译产物（.app）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ComicReader-App
          path: |
            ${{ github.workspace }}/build/Debug-iphonesimulator/ComicReader.app
          retention-days: 30

      - name: 上传完整编译日志（失败时）
        if: failure()
        run: |
          xcodebuild build \
            -project ComicReader.xcodeproj \
            -scheme ComicReader \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build.log 2>&1 || true
        continue-on-error: true

      - name: 上传日志文件
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          retention-days: 7
