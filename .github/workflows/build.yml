name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    name: 编译 iOS 应用
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 项目
        run: xcodegen generate
        working-directory: ComicReader

      - name: 列出 Xcode 版本
        run: xcodebuild -version

      - name: 解析 Swift Package 依赖
        run: xcodebuild -resolvePackageDependencies -project ComicReader/ComicReader.xcodeproj
        working-directory: ${{ github.workspace }}

      - name: 编译（模拟器，无需签名）
        run: |
          xcodebuild build \
            -project ComicReader/ComicReader.xcodeproj \
            -scheme ComicReader \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty
        working-directory: ${{ github.workspace }}

      - name: 上传编译产物（.app）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ComicReader-App
          path: |
            ${{ github.workspace }}/build/Debug-iphonesimulator/ComicReader.app
          retention-days: 30

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ github.workspace }}/**/*.log
          retention-days: 7
