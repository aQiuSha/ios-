# XcodeGen 项目配置
# 用法：xcodegen generate（自动生成 ComicReader.xcodeproj）
# 文档：https://github.com/yonaskolb/XcodeGen

name: ComicReader
options:
  bundleIdPrefix: com.comicreader
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: bottom
  generateEmptyDirectories: true

# Swift Package Manager 依赖
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    majorVersion: 0.9

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_PREVIEWS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  # ==================== 主 App Target ====================
  ComicReader:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ComicReaderApp.swift
      - path: Models
      - path: Views
      - path: ViewModels
      - path: Services
      - path: AppIntents
      - path: LiveActivity
      - path: Resources
        excludes:
          - "*.md"
          - "Info-Icons.plist"
          - "Info-Privacy.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.comicreader.app
        INFOPLIST_KEY_CFBundleDisplayName: 阿邱鲨
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 用于选择漫画封面和阅读背景图片
        INFOPLIST_KEY_NSFaceIDUsageDescription: 用于验证身份以打开隐私文件夹
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        # libarchive 桥接头
        SWIFT_OBJC_BRIDGING_HEADER: Services/libarchiveBridge.h
        # 链接系统库
        OTHER_LDFLAGS: "-larchive"
        # App Group（Widget 共享数据）
        INFOPLIST_KEY_ComicReaderAppGroup: group.com.comicreader.shared
    dependencies:
      - package: ZIPFoundation
      - target: ComicReaderWidget

  # ==================== Widget Extension Target ====================
  ComicReaderWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
        excludes:
          - "WIDGET_SETUP.md"
      # Widget 需要访问数据模型
      - path: Models/Comic.swift
      - path: Models/ReadingSession.swift
      - path: Models/ReaderPreferences.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.comicreader.app.widget
        INFOPLIST_KEY_CFBundleDisplayName: 阿邱鲨小组件
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        INFOPLIST_KEY_ComicReaderAppGroup: group.com.comicreader.shared
    dependencies:
      - package: ZIPFoundation
